name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundary:
    name: Boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assert no platform-specific code in src/
        run: bash bin/check-boundary.sh src

      - name: Assert no redundant nullsafe operators
        run: python3 bin/check-nullsafe.py src tests

      - name: Assert plain ASCII punctuation
        run: python3 bin/check-characters.py

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: vendor/bin/phpunit